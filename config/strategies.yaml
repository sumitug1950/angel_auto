# =============================================================================
# FLAGSHIP STRATEGY SETTINGS   (app ki settings: config/config.yaml)
#
# Badalne ke baad:   .venv\Scripts\python.exe scripts\check_config.py   phir app restart.
#
# Dashboard ke buttons yaad rakhein:
#   Buying  = ITM option KHAREEDO + OTM option BECHO (hedge)
#   Selling = ITM option BECHO    + OTM option KHAREEDO (hedge)
#   Buying mein:   market upar = CALL khareedo,  market neeche = PUT khareedo
#   Selling mein:  market upar = PUT becho,      market neeche = CALL becho
#   Dono legs hamesha ek hi expiry aur ek hi type (Call+Call ya Put+Put) ki hoti hain.
# =============================================================================

active_strategy: macd_itm_otm_spread
flagship_enabled: true         # false = strategy band (dashboard/chart chalega, trade nahi lagega)

strategies:
  macd_itm_otm_spread:
    class_path: "angel_auto.strategy.macd_itm_otm_spread.MacdItmOtmSpreadStrategy"

    # --- MACD (entry ka signal) ------------------------------------------------
    candle_interval_sec: 15        # Nifty ki itne second ki candle par MACD banta hai
    macd:
      fast_period: 12
      slow_period: 26
      signal_period: 9
      min_candles_before_entry: 0  # app start ke baad itni candles tak trade nahi lagega. 0 = band.
                                   # 35 rakho to shuru ke ~9 min (kachcha MACD) mein trade nahi lagega

    check_interval_sec: 15         # har itne second SL / target / trailing aur Pending request check hoti hai.
                                   # kam karoge (jaise 2) to SL jaldi lagega

    # --- Buying / Selling button -------------------------------------------------
    start_with: BUYING             # jab tak koi button nahi dabaya: BUYING ya SELLING

    expiry_choices: 4              # dashboard par agli kitni expiry ke button dikhein. Expiry aap wahin se chunte ho -
                                   # Buying ho ya Selling, agla trade usi expiry mein lagega (dono legs)

    buying:                        # "Buying" button ki settings
      strike_grid: 100             # sirf itne point ke gap wale strikes (100 ya 50)
      itm_delta: 0.7               # KHAREEDNE wali (ITM) strike ka delta
      otm_delta: 0.1               # BECHNE wali (OTM, hedge) strike ka delta

    selling:                       # "Selling" button ki settings
      strike_grid: 100             # 100 ya 50 (50 se delta 0.1 ke aur paas milta hai)
      itm_delta: 0.7               # BECHNE wali (ITM) strike ka delta
      otm_delta: 0.1               # KHAREEDNE wali (OTM, hedge) strike ka delta

    option_band_points: 2500       # Nifty se itne point upar-neeche tak ke options ke live price liye jaate hain.
                                   # otm_delta wali strike isse bahar hui to wo chuni nahi ja sakti.
                                   # Angel One ~1000 live prices tak hi deta hai: expiry_choices x (2 x range / gap + 1) x 2
                                   # isse zyada hua to check_config mana kar dega

    vix_override:                  # India VIX kal ke close se zyada badla to button ki jagah ye lagega
      threshold_pct: 3.0           # kitne % badlaav par
      on_rise: BUYING              # VIX itna BADHA to:  BUYING | SELLING | OFF (kuch force nahi)
      on_fall: SELLING             # VIX itna GHATA to:  BUYING | SELLING | OFF
    iv_rank_lookback_days: 90      # IV Rank sirf record ke liye - kitne din ka VIX itihaas

    # --- Size ------------------------------------------------------------------------
    sizing:
      lots: 1                      # har trade mein kitne lot (1 lot = lot_size qty, config.yaml mein)

    # --- Exit ------------------------------------------------------------------------
    exit:
      sl_amount_rs: 4000           # dono legs ka total loss itna hua to exit
      risk_reward_ratio: 1.2       # target = sl_amount_rs x ye (4000 x 1.2 = 4800). Target par exit nahi,
                                   # trailing shuru hota hai
      trail_gap_rs: 1000           # trailing: sabse zyada profit se itne rupaye gira to exit
      exit_on_opposite_macd: false # true = MACD ulta hote hi bhi exit
      broker_backup_sl: true       # Selling trade mein sell leg par Angel One ke paas bhi SL order (app band ho jaye tab bhi bachaav).
                                   # Buying trade mein nahi lagta - usme buy leg ka SL sell leg ko akela (naked) chhod deta
      broker_backup_sl_multiple: 1.5  # broker SL tab lage jab sell leg ka loss sl_amount_rs x itna ho (app ka SL pehle lagta hai)

    # --- Nifty level order (chart par click karke level / SL / target) -------------------
    level_order:
      enabled: true                # false = dashboard se level order nahi laga sakte
      check_interval_sec: 1        # har itne second Nifty level, Nifty SL aur Nifty target check hote hain
      min_gap_points: 2            # level abhi ke Nifty se kam se kam itne point door ho; SL/target level se itne point door
      entry_retry_sec: 60          # level chhoone ke baad itne second tak order ki koshish (jaise option price na mile), phir cancel
