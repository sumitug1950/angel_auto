# Per-strategy tunables. Registered strategies are looked up by name in strategy/registry.py.

active_strategy: macd_itm_otm_spread
flagship_enabled: false   # the flagship (manual Long/Short spread) stays registered but off by
                           # default while the two automatic zero-cross strategies are being tested

# The two automatic, tick-driven, single-leg strategies - run concurrently, fully independent
# trade records (see Position.strategy_name), no manual buttons, no daily trade-count cap.
zero_cross_strategies:
  - atm_sell_macd_zero
  - itm4_buy_macd_zero

strategies:
  # --- ATM Sell: always SHORTS the ATM option. Bullish tick-MACD zero-cross signal -> short
  # ATM PUT; bearish signal -> short ATM CALL. Exit on the opposite signal or a Rs 500 SL.
  atm_sell_macd_zero:
    class_path: "angel_auto.strategy.macd_zero_cross_single_leg.MacdZeroCrossSingleLegStrategy"
    macd:
      fast_period: 12    # raw TICK counts, not seconds - deliberately chosen for initial testing
      slow_period: 26
      signal_period: 9
    single_leg:
      side: SELL
      strike_grid: 50    # real Nifty strike spacing
      itm_offset_count: 0   # 0 = ATM
    entry_window:
      start: "09:15"
      end: "15:15"
    zero_cross_exit:
      sl_amount_rs: 500
    sizing:
      lots: 1
    risk_override:
      daily_loss_limit_rs: 1500     # ~3 x sl_amount_rs - a pure safety backstop, not a trade-count cap
      max_consecutive_losses: 3
      max_trades_per_day: 100000    # effectively unbounded - re-enters on every fresh signal

  # --- ITM4 Buy: always BUYS the option 4 strikes in-the-money. Bullish signal -> buy ITM4
  # CALL; bearish signal -> buy ITM4 PUT. Same exit rule as ATM Sell.
  itm4_buy_macd_zero:
    class_path: "angel_auto.strategy.macd_zero_cross_single_leg.MacdZeroCrossSingleLegStrategy"
    macd:
      fast_period: 12
      slow_period: 26
      signal_period: 9
    single_leg:
      side: BUY
      strike_grid: 50
      itm_offset_count: 4
    entry_window:
      start: "09:15"
      end: "15:15"
    zero_cross_exit:
      sl_amount_rs: 500
    sizing:
      lots: 1
    risk_override:
      daily_loss_limit_rs: 1500
      max_consecutive_losses: 3
      max_trades_per_day: 100000

  macd_itm_otm_spread:
    class_path: "angel_auto.strategy.macd_itm_otm_spread.MacdItmOtmSpreadStrategy"

    candle_interval_sec: 15   # ticks are aggregated into 15-sec OHLC candles for MACD

    macd:
      fast_period: 12
      slow_period: 26
      signal_period: 9

    pending_request:
      auto_cancel: false       # stays pending until confirmed, manually cancelled, or market close

    structure:
      default: DEBIT           # DEBIT (buy ITM + sell OTM) unless credit conditions below are met
      credit_iv_rank_threshold: 50   # switch to CREDIT (short ITM + buy OTM hedge) only above this IV Rank
      iv_rank_lookback_days: 90
      iv_source: INDIA_VIX
      vix_spike_pct_threshold: 3.0   # if VIX has moved >= this % vs yesterday's close, force DEBIT only - CREDIT
                                      # (naked-ish short) is riskier on a volatility-spike day, overrides IV Rank

    expiry:
      # Rule depends on structure (see structure.default/credit_iv_rank_threshold above):
      #   DEBIT  (ITM buy)  -> monthly expiry, needs time for the long premium to work - min_days_gap applies
      #   CREDIT (ITM sell) -> nearest/current expiry, benefits from fast theta decay
      debit_expiry_type: MONTHLY
      debit_min_days_gap: 10    # if the nearest monthly is closer than this, roll to the next monthly
      credit_expiry_type: NEAREST

    strikes:
      itm_delta_target: 0.7
      otm_delta_target: 0.1
      strike_grid: 100   # only strikes on this spacing are considered (monthly contracts also list a denser 50-pt grid near ATM - skip it)

    sizing:
      lots: 1                  # fixed - no scaling formula

    exit:
      sl_amount_rs: 4000
      risk_reward_ratio: 1.2   # target_amount_rs = sl_amount_rs * risk_reward_ratio = 4800
      trail_gap_rs: 1000       # trailing stop = peak_profit - trail_gap_rs, once target is first reached
      exit_on_opposite_macd: false   # off - only fixed SL / trailing target / manual exit / square-off close a position
