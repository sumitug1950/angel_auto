services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: angel_auto
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../config/.env   # create this from config/.env.example first - real credentials, gitignored
    environment:
      # Pass-through only - no value set here on purpose. mode: live in config.yaml is not
      # enough on its own (see core/app.py); this must also be exported by hand in the SSH
      # session right before `docker compose up -d`, e.g.:
      #   export ANGEL_LIVE_TRADING_CONFIRMED=YES_I_UNDERSTAND_THE_RISK
      #   docker compose up -d
      # Never put the real value in config/.env or any committed file - the whole point is
      # that going live takes a deliberate action each time, not a saved setting.
      - ANGEL_LIVE_TRADING_CONFIRMED
    volumes:
      - ../config/config.yaml:/app/config/config.yaml:ro
      - ../config/strategies.yaml:/app/config/strategies.yaml:ro
      - angel_auto_data:/app/data_store   # SQLite DB, logs, scrip master cache - survives restarts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  # Optional, for later: swap SQLite for Postgres without touching any model code (same
  # SQLAlchemy models - just point database.url in config.yaml at this service and add
  # psycopg2-binary to pyproject.toml). Left commented out; SQLite is the documented
  # default for a single-VPS deployment - only bother with this if write contention or
  # backup/replication needs actually show up.
  # postgres:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: angel_auto
  #     POSTGRES_USER: angel_auto
  #     POSTGRES_PASSWORD: change_me
  #   volumes:
  #     - angel_auto_pgdata:/var/lib/postgresql/data

volumes:
  angel_auto_data:
  # angel_auto_pgdata:
