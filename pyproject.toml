[project]
name = "angel-auto"
version = "0.1.0"
description = "Advanced automated Nifty options trading system on Angel One SmartAPI"
requires-python = ">=3.11"
dependencies = [
    "smartapi-python>=1.5.5",
    "pyotp>=2.9.0",
    "websocket-client>=1.8.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "PyYAML>=6.0.1",
    "SQLAlchemy>=2.0.30",
    "APScheduler>=3.10.4",
    "tenacity>=8.3.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.9",
    "structlog>=24.1.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "freezegun>=1.5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["angel_auto*"]
